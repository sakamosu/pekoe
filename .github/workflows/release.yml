# v* タグの push で GoReleaser がクロスビルドして GitHub Release を下書きで作り(.goreleaser.yaml)、
# アーカイブに来歴(attestation)を付けてから公開する。どこかで落ちたら下書きのまま残り、公開されない。
# immutable releases を有効にすると公開した後はアセットを足せないので、公開は最後にする。
# アクションはコミット SHA で固定する(コメントの版は Dependabot が SHA と一緒に上げる)。
name: release

on:
  push:
    tags: ["v*"]

# ジョブで要るものだけを足す
permissions: {}

env:
  # goreleaser の版。goreleaser-action は本体を GitHub Release のアセットから取るが、
  # その配信が 504 で落ちることがあるので、Go のモジュールプロキシ(proxy.golang.org)から入れる。
  GORELEASER_VERSION: v2.20.0
  # govulncheck の版(v1.9.0 は go >= 1.26.0)
  GOVULNCHECK_VERSION: v1.9.0
  # setup-go が入れた Go(= go.mod の go 行)だけを使う。auto だと新しい Go に
  # 切り替わり、ビルドや govulncheck が別の Go で動いてしまう
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # 署名・公証の secrets(MACOS_*)はこの Environment に置く。承認者を付けて、承認されたタグの実行だけが読めるようにする
    environment: release
    permissions:
      contents: write # Release を作ってアーカイブを上げ、公開する
      id-token: write # 来歴(attestation)の署名に Sigstore の証明書を取る
      attestations: write # 来歴を保存する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog に前のタグからの履歴が要る
          persist-credentials: false # git push はしない
      # setup-go は GitHub のマニフェスト(actions/go-versions)から Go を取り、取れなければ go.dev から取る。
      # どちらも落ちていればここで止まる(その場合は再実行する)。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # リリースは他のブランチが書いたキャッシュを使わない
      - name: Check Go version
        run: |
          want="go$(go mod edit -json | jq -r .Go)"
          got="$(go env GOVERSION)"
          echo "go.mod: $want, runner: $got"
          test "$want" = "$got"
      # 配るのと同じ Go・同じビルド(既定と -tags web の両方を配る)で検査する
      - name: govulncheck
        run: |
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -tags web ./...
      # goreleaser は go.mod より新しい Go を要求することがある(v2.20.0 は go >= 1.27.3)ので GOTOOLCHAIN=auto にする。
      # ツールチェーンも golang.org/toolchain としてモジュールプロキシから落ちてくる。
      # goreleaser がビルドする pekoe 側は go.mod の版(GOTOOLCHAIN=local)のまま。
      - name: Install goreleaser
        run: GOTOOLCHAIN=auto go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
      - name: Release (draft)
        run: |
          goreleaser check
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # darwin のバイナリの署名と公証(.goreleaser.yaml の notarize)。
          # MACOS_SIGN_P12 が無ければ空になり、署名せずにビルドする
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # checksums.txt に載ったアーカイブごとに SLSA のビルド来歴を付ける。
      # 確かめ方は README の「リリースから」(gh attestation verify)。
      # private リポジトリでは GitHub Enterprise Cloud でないと使えないので、公開しているときだけ
      # pekoe update は v0.4.0 以降のリリースに来歴が無いと止まる(selfupdate.ProvenanceFrom)。
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # ここまで通ったら下書きを公開する。プレリリース(vX.Y.Z-rc.1 など。goreleaser の prerelease: auto)は
      # Latest にしない。下書きは make_latest を持てないので、公開するときに付ける。
      - name: Publish the release
        run: |
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
