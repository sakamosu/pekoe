# pekoe の TIPS: 機能を 1 つずつ紹介する(TUI の 4 の空き表示と tapi chat のあいさつ)。
# 文面だけは日本語(docs/ui-guidelines.md「実装ルール」の例外)。キー名・コマンド・設定名はそのまま。
#
#   id     英小文字と - の短い名前。見せた記録(tips.json)に残るので変えない
#   short  1 行の説明(全角 28 字ほどまで)
#   detail 詳しい説明(TUI で 2〜3 行に折り返す長さ)
#   keys   関係するもの。TUI のキー(ヘルプの表記)、"pekoe <sub> …"、--flag、
#          "[section]"(config.toml)、nvim / Chrome のキー。書いたものは実装と照らして確かめる
#   docs   関係する docs のパス(pekoe tip --doc で読める。# の後ろは見出し)
#
# ^q は prefix の既定。TUI では [keys] prefix に合わせて書き換えて出す。
# ヘルプのキー・サブコマンド・config.toml の節はどれかの tip の keys に出てくるか、
# cover.go の NoTip に理由つきで載っていないといけない(網羅テスト。CLAUDE.md「TIPS」)。

[[tip]]
id = "zoom"
short = "^q z で右のペイン(4)を全幅に広げる"
detail = "入力中でも ^q z で左の列を隠し、エージェントの画面を全幅にする。もう一度押すと戻る。ズーム中は最下行に zoom と出る。"
keys = ["^q z"]
docs = ["docs/tui.md"]

[[tip]]
id = "pane-width"
short = "^q < > で左の列の幅を 4 列ずつ変える"
detail = "^q = で既定(40%)に戻る。幅とズームは layout.json に残り、再起動後の TUI や CLI から起動するエージェントの幅もそろう。"
keys = ["^q <", "^q >", "^q ="]
docs = ["docs/tui.md"]

[[tip]]
id = "tapi-chat"
short = "t で tapi に話しかけられる(tapi chat)"
detail = "どのパネルからでも t で 4 が tapi との会話に変わる。調べものやセッションを作って任せるのを頼める。^q で閉じても会話は残り、T でリセット。"
keys = ["t", "T", "pekoe tapi", "[tapi]"]
docs = ["docs/tapi-chat.md", "docs/tui.md#tapi-chat"]

[[tip]]
id = "tapi-row"
short = "Sessions の一番上の行は tapi(統括役)"
detail = "tapi の行には状態・その状態になってからの時間・最後の返事の 1 行が出る。j k や g で選んで ↵ で tapi chat が開く。絞り込み中も残り、x や l などセッション向けのキーは効かない。"
keys = ["↵"]
docs = ["docs/tapi-chat.md", "docs/tui.md#tapi-chat"]

[[tip]]
id = "panel-focus"
short = "1〜4 と Tab でパネルを直接移る"
detail = "1 Sessions・2 Worktrees / Browser / Issues・3 Changes / Picks・4 Agent。Tab と Shift+Tab で順に移り、[ ] でパネルの中のサブタブを切り替える。"
keys = ["1", "2", "3", "4", "Tab", "[", "]"]
docs = ["docs/tui.md"]

[[tip]]
id = "next-wait"
short = "]a で次の待ちセッションへ飛ぶ"
detail = "未回答の受信箱の問いを先に開き、次に許可待ち・入力待ちのセッション(tapi も)へ順に飛ぶ。PR に動きがあったセッションでは PR ビューが開く。[a で飛ぶ前の場所に戻る。"
keys = ["]a", "[a"]
docs = ["docs/tui.md"]

[[tip]]
id = "next-review"
short = "]r で次のレビュー待ちへ"
detail = "ターンを終えて done になったセッションはレビュー待ちに入る。]r で順に回り、r でレビュー面を開く。"
keys = ["]r", "r"]
docs = ["docs/tui.md#レビュー"]

[[tip]]
id = "run-window"
short = "! で worktree の中でコマンドを 1 回だけ実行する"
detail = "Sessions で ! を押すと run 窓が開く。終わったら ↵ で agent に戻り、y で結果(終了コード)をエージェントに伝えられる。x は伝えずに閉じる。"
keys = ["!"]
docs = ["docs/tui.md"]

[[tip]]
id = "preview"
short = "v で dev server のスクショを TUI の中に出す"
detail = "v を押すたびに preview → dev → agent と窓が変わる。preview では m でモバイル幅、c で before / after を見比べ、g で別のパスを撮る。"
keys = ["v", "m", "c", "g"]
docs = ["docs/tui.md"]

[[tip]]
id = "conflicts"
short = "同じファイルを触るセッションには警告のアイコンと数が付く"
detail = "衝突予報。pekoe conflicts で、同じファイルを触っているセッションのペアと、git merge-tree で実際に衝突するかが分かる。l の land の確認にも出る。"
keys = ["pekoe conflicts", "l"]
docs = ["docs/commands.md"]

[[tip]]
id = "issues"
short = "[2] Issues の issue からそのままセッションを作る"
detail = "2 のサブタブ Issues で f を押すと 自分担当 → 全 open → ラベル指定 と切り替わる。n でその issue から新しいセッションを作る。CLI では pekoe issues。"
keys = ["2", "f", "n", "pekoe issues"]
docs = ["docs/tui.md"]

[[tip]]
id = "pr-view"
short = "p で PR ビュー(checks・レビュー・スレッド)を開く"
detail = "失敗した check の log やレビューのスレッドを ↵ で開ける。space で選んで s を押すと、まとめてエージェントに送れる。"
keys = ["p", "space", "s"]
docs = ["docs/tui.md"]

[[tip]]
id = "permission-anywhere"
short = "許可待ちはどこにいても最前面に出る"
detail = "どのセッションでも tapi chat でも、許可待ちになると Permission モーダルがどこの許可かを添えて出る。y / n で答えても画面は動かない。文字を打っている間は抜けるまで待つ。esc で閉じたものは ]a で行ける。"
keys = ["]a"]
docs = ["docs/tui.md", "docs/design.md"]

[[tip]]
id = "web-ui"
short = "iPhone から許可待ちに答えられる(Web UI)"
detail = "make install WEB=1 で入れて [web] に enable と allow_users を書くと、tailnet 経由で一覧・allow / deny・send・画面が見られる。質問のメニューにはキーパッドで答える。URL は pekoe web。"
keys = ["pekoe web", "[web]"]
docs = ["docs/web.md", "README.ja.md#iphone-からweb-ui"]

[[tip]]
id = "web-inbox"
short = "iPhone の Web UI から受信箱に答えられる"
detail = "Inbox タブは事実とリンクが先、エージェントの文が後。推奨は選ばれていないので自分で選び、確認シートを見て送る。Overview タブは件数と各セッションの impl → review → PR → CI → merge。"
keys = ["pekoe web"]
docs = ["docs/web.md", "README.ja.md#iphone-からweb-ui"]

[[tip]]
id = "web-tapi"
short = "iPhone の Web UI から tapi に話しかけられる"
detail = "下端のタブバーの tapi(または Now の TAPI の行)から send で頼む。送る前に確認シートで宛先と全文を見せる。[web] allow_devices で端末を絞っているときだけ送れる。tapi の許可への allow / deny は端末で。"
keys = ["pekoe web", "[web]"]
docs = ["docs/web.md", "README.ja.md#iphone-からweb-ui"]

[[tip]]
id = "web-image"
short = "Web UI の send に写真・スクショを添えられる"
detail = "送信欄の ＋ で 4 枚まで選ぶ。pekoed が worktree の外に保存し、文の後に [image] <パス> を添えるので、エージェントは Read で開ける。セッションの rm と 7 日で消える。"
keys = ["pekoe web"]
docs = ["docs/web.md#画像の扱い", "README.ja.md#iphone-からweb-ui"]

[[tip]]
id = "local-gui"
short = "pekoe gui で Mac のブラウザから操作できる"
detail = "pekoe gui で 127.0.0.1 のデスクトップ向けの画面が一度きりのリンクで開く。許可待ちには always も出る(TUI の A)。エージェントに操作させないブラウザ(プロファイル)で開く。"
keys = ["pekoe gui", "[gui]"]
docs = ["docs/gui.md"]

[[tip]]
id = "gui-pipeline-tree"
short = "pekoe gui の Pipeline は依頼ごとにブランチを束ねて見せる"
detail = "依頼の見出し(r14 と依頼の文)の下に、その依頼が作ったブランチの行が並ぶ。片付いた依頼は薄く出る。あとから入った依頼は札(◉ r2 が取り組み中、+r2 が済み)。待ちの理由は Status の 2 行目に出る。"
keys = ["pekoe gui"]
docs = ["docs/gui-design.md#pipeline"]

[[tip]]
id = "gui-merge-gates"
short = "pekoe gui の受信箱はマージの条件を棒で見せる"
detail = "PR のあるカードには MERGE GATES · 5/6 と条件 1 つに 1 本の棒(緑が揃った、赤が欠けている)、その下に条件ごとの理由が出る。CI はチェック 1 つに 1 区切りの棒で、通った・落ちた・待っている数を添える。"
keys = ["pekoe gui"]
docs = ["docs/gui-design.md#受信箱のカードの事実"]

[[tip]]
id = "local-gui-theme"
short = "pekoe gui の画面はライトにもなる"
detail = "既定は OS の外観(ライト・ダーク)に合わせる。タイトルバーのボタンで System → Dark → Light と巡り、選んだものはそのタブの間だけ覚える(System で OS に戻る)。[theme.colors] の上書きはダークにだけ効く。"
keys = ["pekoe gui"]
docs = ["docs/gui-design.md#カラートークン"]

[[tip]]
id = "local-gui-sidebar-width"
short = "pekoe gui のサイドバーと tapi パネルは幅を変えられる"
detail = "サイドバーの右端・tapi パネルの左端をドラッグで幅が変わり、ダブルクリックで既定に戻る。境界にフォーカスして ←/→ でも動く。幅はブラウザに残る(既定の port = 0 では次の待ち受けで既定に戻る)。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-サイドバーのビューレール"]

[[tip]]
id = "local-gui-dashboard-stats"
short = "pekoe gui の Overview にマージ数と今日のトークン"
detail = "Dashboard の Overview に今日と 7 日のマージ数・日別の棒・今日のトークンが出る(pekoe stats と同じ数)。Requests は開いている依頼と閉じた直近 5 件で、Open ledger で閉じたものを遡れる。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階"]

[[tip]]
id = "local-gui-actions"
short = "pekoe gui で新規作成・Interrupt・tapi の Reset"
detail = "n New session で作り(TUI の n)、動いているエージェントは esc Interrupt で止める(Escape を 1 回)。T Reset は tapi の会話だけ消し、依頼と受信箱は残す。どれも確認シートを通す。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-new-sessiontapi-の-resetinterrupt"]

[[tip]]
id = "local-gui-issue-new"
short = "pekoe gui の New session で issue から作る"
detail = "New session の Pick issue… で issue を選ぶと、ブランチ名を埋め、題と本文を囲んだプロンプトの全文を確認シートで見せてから作る(pekoe new --from gh#N と同じ)。後で書き換わったら作らない。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-issue-から-new-sessiontapi-の-start"]

[[tip]]
id = "local-gui-tapi-start"
short = "pekoe gui の tapi パネルから tapi を起動する"
detail = "T Reset の後など tapi が動いていないとき、Dashboard の tapi パネルの t Start で起動する(TUI の t。終了していれば t Restart)。確認は無く、依頼や受信箱はそのまま。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-issue-から-new-sessiontapi-の-start"]

[[tip]]
id = "local-gui-shell"
short = "pekoe gui の送信欄で ! のコマンドを送る前に確かめる"
detail = "! で始まる文は Claude Code が許可なしにシェルのコマンドとして動かすので、送る前に確認シートで宛先と全文を見せる。入力欄の外では、許可待ちに y / A / n、質問に 1-9 が効く。"
keys = ["pekoe gui"]
docs = ["docs/gui-design.md#決まったこと"]

[[tip]]
id = "local-gui-session-chat"
short = "pekoe gui でセッションの会話を吹き出しで読む"
detail = "セッションの Chat で Claude Code の会話を吹き出しで読める(Load earlier で先頭まで)。既定は Screen。送信欄の / Commands と @ Files は、コマンドやファイルの名前を入れるだけで、送るのは自分。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-セッションの吹き出しと送信欄の--"]

[[tip]]
id = "local-gui-session-panel"
short = "pekoe gui の Session の右パネルにモデル・モード・Context"
detail = "AGENT にモデルと effort、モード(auto mode は黄色)、Context のトークン数。動く Claude Code が入っている版より古ければ NOTICES に Update installed。どれも自己申告で表示だけ。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-session-の右パネルのモデルモードcontext更新"]

[[tip]]
id = "local-gui-worktrees"
short = "pekoe gui の Worktrees で全リポジトリの worktree を見る"
detail = "左端のレールの Worktrees で、リポジトリごとの worktree とブランチ・ポート・セッションの状態が出る(TUI の [2] Worktrees)。セッションのある行を押すと開く。消す操作は無く、削除は TUI の D か pekoe rm。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#worktrees"]

[[tip]]
id = "local-gui-changes"
short = "pekoe gui の Changes で変更したファイルと差分を読む"
detail = "レールの Changes に、開いているセッションの変更したファイル(A/M/D・+/−・同じファイルを触るセッションの ⚠)が出る。押すとその差分を読める(読むだけ。コメントと承認は TUI のレビューで)。"
keys = ["pekoe gui"]
docs = ["docs/gui.md#段階-2-の一部-changes-のビュー"]

[[tip]]
id = "local-gui-settings"
short = "pekoe gui の Settings で使っている設定を読む"
detail = "レールの下端の Settings に、pekoe config show と同じ設定が節ごとに説明つきで出る。restart は pekoe daemon restart まで効かないもの、set は config.toml にあるもの。変えるのは pekoe config edit。"
keys = ["pekoe gui", "pekoe config show"]
docs = ["docs/gui.md#段階-2-の一部-settings読むだけ"]

[[tip]]
id = "web-tapi-confirm"
short = "tapi への send の確認シートは設定で切れる"
detail = "[web] confirm_tapi_send = false にすると、Web UI の tapi chat で send がシートなしで送られる。再起動は要らない。切ると誤送信や端末を拾われたときの守りが allow_devices と画面ロックだけになる。"
keys = ["[web]"]
docs = ["docs/web.md"]

[[tip]]
id = "web-tapi-bubbles"
short = "Web UI の tapi chat は吹き出しで読める"
detail = "会話は tapi の transcript から取り、自分は右・tapi は左の吹き出しで出す。ツールは 1 行に畳み、タップで名前と引数を開く。タイトル右の chat | screen で今までの画面表示に戻せる。"
keys = ["pekoe web"]
docs = ["docs/web.md"]

[[tip]]
id = "new-from-issue"
short = "pekoe new <branch> --from gh#N で issue から始める"
detail = "GitHub の issue の本文を初期プロンプトにしてセッションを作る。--prompt なら指示を直接渡せる。"
keys = ["pekoe new --from gh#N", "pekoe new --prompt"]
docs = ["README.ja.md#クイックスタート"]

[[tip]]
id = "send"
short = "pekoe send <slug> で外からエージェントに一言送る"
detail = "既定で Enter まで送る。- を渡すと stdin から読むので、長い指示はヒアドキュメントで渡せる。--no-enter なら Enter を足さない。"
keys = ["pekoe send <slug> <text>", "pekoe send <slug> -", "--no-enter"]
docs = ["docs/commands.md"]

[[tip]]
id = "report"
short = "セッションのエージェントは pekoe report で結果を残す"
detail = "pekoe report \"直した\" --status done --evidence <PR の URL>。どのセッションの報告かは pekoed がプロセスから決める。pekoe reports [<slug>] で読み、最新のものは pekoe --json ls の report にも出る。"
keys = ["pekoe report", "pekoe reports", "--status", "--evidence"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "wait"
short = "pekoe wait --mine で任せたセッションの知らせを待つ"
detail = "知らせが来るまで止まる(ポーリングしない)。返った cursor を次の --since に渡す。--on report,inbox,failed,waiting,ci で絞れば空振りの done などで起きない。reset なら pekoe --json ls から読み直す。"
keys = ["pekoe wait", "--mine", "--since", "--on"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "wait-ci"
short = "pekoe wait --on ci で PR の CI が決着したときだけ起きる"
detail = "PR の HEAD のチェックが全部終わると 1 回だけ知らせる(green / red・落ちたチェック名・HEAD の SHA)。push で HEAD が変われば次の決着でもう 1 回。gh pr checks --watch を自分で回さなくていい。"
keys = ["pekoe wait", "--on"]
docs = ["docs/commands.md", "docs/orchestration.md"]

[[tip]]
id = "wait-started"
short = "pekoe wait --on started で作ったセッションの setup 待ち"
detail = "--on started,failed,removed で、setup が済んだ・落ちた・作成中に消されたときに返る。pekoe --json new が返す cursor を --since に渡せば、すぐ済んだ setup も取りこぼさない。"
keys = ["pekoe wait", "--on", "--since", "pekoe new"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "new-after"
short = "pekoe new --after で、どのセッションの後かを残す"
detail = "--after feat-a(複数可)で順序を記録する。[1] の行に after feat-a、選ぶとフッターに相手の状態。記録と表示だけで起動は止めない(止めるなら --hold)。今あるセッションだけ渡せ、自分自身と循環は断られる。"
keys = ["pekoe new", "--after"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "new-hold"
short = "pekoe new --after X --hold で X のマージまで始めない"
detail = "--hold を付けたセッションは queued で待ち、--after の相手がすべて landed になると、そのときの origin/<base> から始まる。相手が failed なら待ち続け、landed にならずに消されたら failed になる。"
keys = ["pekoe new", "--after", "--hold"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "max-running"
short = "[orchestrator] max_running で同時に動かす数を絞る"
detail = "max_running = 2 なら、作業中(creating・running・waiting)が 2 本の間に作った pekoe new は queued で待ち、1 本止まるたびに古い順に始まる。理由は pekoe --json ls の queue に出る。既定 0 は上限なし。"
keys = ["[orchestrator]", "pekoe new"]
docs = ["docs/config.md", "docs/api.md"]

[[tip]]
id = "ask-human"
short = "エージェントは pekoe ask-human で人に判断を頼む"
detail = "--option で選択肢、--recommend で推奨、--kind approve / login / fyi。--wait で答えまで待つ。待たなければ手が空いたときに答えが入力欄に届く。事実(HEAD・差分・PR・CI)は pekoed が付ける。"
keys = ["pekoe ask-human", "--option", "--recommend", "--kind", "--wait"]
docs = ["docs/api.md", "docs/orchestration.md"]

[[tip]]
id = "orchestrator-notify"
short = "tapi と受信箱の待ちもセッションの wait と同じに知らせる"
detail = "tapi の許可待ちや、エージェントが答えを待つ受信箱の問いは、トースト → 30 秒で点滅 → 2 分で OS 通知。[orchestrator] notify = \"quiet\" で最下行・メッセージ行だけに戻る。"
keys = ["[orchestrator]"]
docs = ["docs/orchestration.md", "docs/mascot.md"]

[[tip]]
id = "inbox-popup"
short = "受信箱の新しい問いは、その場で答える画面が出る"
detail = "エージェントが答えを待つ問いが来ると、キーが 2 秒止まったときに答える画面が出る。最初は skip を選んであり、esc か ↵ で飛ばすと受信箱に残る(]a)。[orchestrator] inbox_popup = false で止まる。"
keys = ["[orchestrator]", "]a"]
docs = ["docs/orchestration.md", "docs/config.md"]

[[tip]]
id = "orchestrator-deliver"
short = "pekoe wait を使わない tapi にも、報告を 1 行で届けられる"
detail = "[orchestrator] deliver = \"idle\" で、tapi の手が空いたときにたまった報告・受信箱の答えなどを 1 行で送る。tapi chat に打っている間・許可ダイアログの間は送らず、tapi の wait が受け取るものも送らない。"
keys = ["[orchestrator]"]
docs = ["docs/orchestration.md", "docs/tapi-chat.md"]

[[tip]]
id = "inbox"
short = "pekoe inbox で受信箱を見て、inbox answer で答える"
detail = "エージェントからの問いの一覧。pekoe inbox <id> で詳しく、pekoe inbox answer <id> <番号> --note … で答える(人だけ)。合う選択肢が無ければ番号を省き --note だけで。--all で答えたものも出る。"
keys = ["pekoe inbox", "pekoe inbox answer <id>", "--all", "--note"]
docs = ["docs/api.md"]

[[tip]]
id = "git-watch"
short = "hooks が本体の .git/hooks・config を変えたら受信箱に出る"
detail = "test・setup・dev などの前後で本体の .git/hooks と core.hooksPath・core.fsmonitor などを比べ、変われば hook 名と差分を受信箱に出す。husky なら想定どおり。直しはしない。"
keys = ["pekoe inbox"]
docs = ["docs/api.md#本体の-git-の見張り"]

[[tip]]
id = "ledger"
short = "tapi に頼んだことは依頼(pekoe ledger)として残る"
detail = "tapi に打った文は open の依頼として記録され、tapi が new --request でセッションと結び、済んだら閉じる。リセットしても残り、新しい tapi は残った依頼から続ける。開き直す・消すのは人だけ(reopen / rm)。"
keys = ["pekoe ledger", "pekoe new --request", "--request", "--as"]
docs = ["docs/tapi-chat.md", "docs/api.md"]

[[tip]]
id = "id-letters"
short = "r12 は依頼、q12 は問い、p12 は報告の番号"
detail = "pekoe の番号は頭文字で種類が分かる(依頼 r・受信箱の問い q・報告 p)。#12 は GitHub の PR・issue だけ。コマンドには q12 でも 12 でも渡せて、pekoe ledger q12 のように種類が違えば断られる。"
keys = ["pekoe ledger", "pekoe inbox"]
docs = ["docs/orchestration.md#番号の表記"]

[[tip]]
id = "ledger-tidy"
short = "tapi への雑談やお礼は、依頼から自動で閉じる"
detail = "tapi が返事を終えたとき、誰にも頼まず待ち始めてもいなければ、その入力は chat で閉じる。閉じたものは 24 時間 pekoe ledger とダッシュボードに薄く出て、tapi が keep で戻せる。"
keys = ["pekoe ledger"]
docs = ["docs/api.md#依頼ledger"]

[[tip]]
id = "inbox-answer"
short = "受信箱の問いには ]a から答える"
detail = "エージェントが人に頼むとトーストが出る。]a で未回答の問いを先に回り、pekoe が読んだ事実を見てから 1〜6 で選んで ↵。推奨は既定で選ばれない。n でメモ、x で答えずに閉じる。:inbox でも開く。"
keys = ["]a"]
docs = ["docs/orchestration.md"]

[[tip]]
id = "dashboard"
short = "tapi の行を選ぶと [4] がダッシュボードになる"
detail = "Overview・Inbox・Pipeline(impl → review → PR → CI → merge)・Requests・Sends・Decided(fyi)を 1 画面に。4 で入り j k で選んで ↵ で答えるか行を開く、o でリンク。tapi chat は ↵ のまま。"
keys = ["4"]
docs = ["docs/orchestration.md", "docs/tui.md#tapi-chat"]

[[tip]]
id = "chat-to-dashboard"
short = "^q o で tapi chat からダッシュボードへ 1 手で移る"
detail = "tapi chat に打ち込んでいる最中でも、セッションからでも ^q o で 4 のダッシュボードへ。t で tapi chat に戻ってそのまま打てる。Sessions の tapi の行では l / → でもダッシュボードへ、↵ は tapi chat。"
keys = ["^q o", "l"]
docs = ["docs/tui.md#tapi-chat", "docs/tapi-chat.md"]

[[tip]]
id = "dashboard-pipeline"
short = "ダッシュボードの工程表はバーと一言で今の段階を見せる"
detail = "バーは impl → review → PR → CI → merge。緑が済み・黄が進行中・赤が失敗・青緑がマージしてよい。後ろに今の段階(CI running など)と足りない条件の理由が出る。マージ済みは最後にまとまる。"
keys = ["4"]
docs = ["docs/orchestration.md"]

[[tip]]
id = "dashboard-stats"
short = "ダッシュボードの概要に今日のマージ数とトークンが出る"
detail = "📊 today に今日のマージ数とトークン(out と cache write を主に、cache read と in は控えめに)、📅 7 days に直近 7 日のマージ数を ▅▁ で 1 日ずつ。pekoe stats と同じ数で、30 秒ごとに読み直す。"
keys = ["4", "pekoe stats"]
docs = ["docs/orchestration.md", "docs/api.md"]

[[tip]]
id = "dashboard-review-stage"
short = "工程表の review は独立レビューの最中も見える"
detail = "pekoe report --status review --verdict pending で 🔍 in review。pass で済み、fail で review failed。PR の後に中身が変われば needs re-review、rebase で SHA が変わっただけなら合格のまま。"
keys = ["4"]
docs = ["docs/orchestration.md", "docs/api.md"]

[[tip]]
id = "dashboard-evidence"
short = "工程表の行で o を押すと報告の evidence を開ける"
detail = "報告に付いたスクショ・動画・ログ・URL を一覧にし、j k で選んで ↵ で開く。PNG は kitty の画像表示が使える端末ならその場に、ほかは外のアプリかブラウザで。スクリプトなどは開かず場所だけ見せる。"
keys = ["4", "o"]
docs = ["docs/orchestration.md"]

[[tip]]
id = "merge-from-inbox"
short = "根拠の項目に merge と答えると pekoed が PR をマージする"
detail = "pekoed が条件を読み直し、HEAD が項目と同じときだけ gh pr merge する。崩れていればマージせず理由を出す。TUI では merge は ↵ を 2 回(1 回目は確認)。方法は [merge] method。"
keys = ["]a", "pekoe inbox answer <id>"]
docs = ["docs/api.md", "docs/orchestration.md"]

[[tip]]
id = "merge-evidence"
short = "マージしてよい根拠が揃うと pekoed が受信箱で知らせる"
detail = "land した PR が、HEAD への独立レビューの合格・CI が緑(無ければ該当なし)・CLEAN・衝突予報なし・--after の相手が landed を満たすと項目が 1 件来る。merge でマージ、send back でメモがセッションに届く。"
keys = ["]a", "pekoe inbox"]
docs = ["docs/api.md", "docs/orchestration.md"]

[[tip]]
id = "land"
short = "l(pekoe land)で rebase → test → PR 作成まで進める"
detail = "push して gh pr create まで進める。確認には衝突予報が出る。マージを見つけたら teardown と worktree の削除まで pekoe がやる。"
keys = ["l", "pekoe land <slug>"]
docs = ["docs/commands.md"]

[[tip]]
id = "review"
short = "r のレビュー面で hunk ごとに承認・コメントする"
detail = "a で承認、x で差し戻し、c でコメント、]h で次の hunk。S でコメントを 1 通にまとめて送る。pekoe review gh#N で人の PR も。[review] surface = \"tui\" なら nvim なしの組み込み面。"
keys = ["r", "a", "x", "c", "]h", "S", "pekoe review gh#N", "[review]"]
docs = ["docs/tui.md#レビュー"]

[[tip]]
id = "error-cards"
short = "dev server やブラウザのエラーは 4 にカードで出る"
detail = "pekoed が見つけたエラーは s でエージェントに送る、i で無視、↵ で詳細。カードがある間、入力を始めるのは a。[2] Browser の E でコンソールのエラーも送れる。"
keys = ["s", "i", "↵", "a", "E"]
docs = ["docs/tui.md"]

[[tip]]
id = "repo-switch"
short = "w で今のリポジトリを選び直す"
detail = "複数のリポジトリで使っているとき、w で 1 つを選ぶ。n の新しいセッション・Issues・Worktrees はそのリポジトリに向く。"
keys = ["w"]
docs = ["docs/tui.md"]

[[tip]]
id = "command-line"
short = ": でコマンドを名前で打つ"
detail = "new・send・land・rm・dev・undo・review・restart・inbox・cleanup・ext・tutorial・q を、キーを覚えていなくても名前で実行できる。"
keys = [":"]
docs = ["docs/tui.md"]

[[tip]]
id = "tutorial"
short = "H でチュートリアルをもう一度見る"
detail = "画面の各部分を 1 つずつ照らして説明するツアー。サンプルのセッションで動くので本物には触れない。:tutorial でも始まる。↵ で次、← で戻る、esc でやめる。"
keys = ["H"]
docs = ["docs/tui.md#チュートリアル"]

[[tip]]
id = "tutorial-lang"
short = "チュートリアルは tab で英語と日本語を切り替えられる"
detail = "H でツアーを開き、tab を押すと今のステップのまま言語が変わる。選んだ言語は tutorial.json に残り、次のツアーもその言語で始まる。最初は LANG などのロケールで決まる。"
keys = ["H"]
docs = ["docs/tui.md#チュートリアル"]

[[tip]]
id = "help"
short = "? のキー一覧は選んで ↵ でそのまま実行できる"
detail = "上に今のパネルのキー、下にどこでも効くキーが並ぶ。上のキー(と下の t・T・H)は j / k で選んで ↵ でそのまま実行できる。"
keys = ["?"]
docs = ["docs/tui.md"]

[[tip]]
id = "nvim"
short = "Neovim から選択範囲をセッションに送る"
detail = "nvim プラグインの <leader>bs で選択範囲を送り、<leader>bn で選択から新しいセッションを作る。:PekoeFollow でエージェントが編集したファイルを追いかける。"
keys = ["<leader>bs", "<leader>bn", ":PekoeFollow"]
docs = ["nvim/README.md"]

[[tip]]
id = "nvim-approval"
short = "nvim の許可待ちフロートは <leader>ba で入る"
detail = "許可待ちになると右下にフロートが出るがフォーカスは奪わない。<leader>ba か :PekoeApproval で入り、画面の末尾で中身を確かめてから y / n で答える。"
keys = ["<leader>ba", ":PekoeApproval"]
docs = ["nvim/README.md#許可待ちフロート"]

[[tip]]
id = "chrome-pick"
short = "Chrome 拡張で画面の要素を選んで送る"
detail = "⌘⇧E で要素を選び、指示と切り抜きスクショを送る。指示つきならそのポートのセッションへ直送([picks] auto_send)。カードでは ↵ 送信、^s 別セッション、^n 新しいセッション。port と token は pekoe ext。"
keys = ["⌘⇧E", "pekoe ext", "[picks]"]
docs = ["extension/README.md", "README.ja.md#chrome-拡張"]

[[tip]]
id = "undo"
short = "u で最後のプロンプトの変更を取り消す"
detail = "pekoe はプロンプトごとに変更のスナップショットを取っている。pekoe undo <slug> n なら n 番目のプロンプトを送った時点まで戻す。"
keys = ["u", "pekoe undo <slug> [n]"]
docs = ["docs/commands.md"]

[[tip]]
id = "filter"
short = "/ でセッション一覧を絞り込む"
detail = "Sessions で / を押して文字を打つと一覧が絞られる。↵ で確定、Esc で解除。"
keys = ["/"]
docs = ["docs/tui.md"]

[[tip]]
id = "adopt"
short = "pekoe adopt で手で始めたエージェントを取り込む"
detail = "pekoe の外で動いている Claude Code を止め、同じ会話を pekoe の中で resume する。既存の worktree は pekoe open で取り込める。"
keys = ["pekoe adopt", "pekoe open"]
docs = ["docs/commands.md"]

[[tip]]
id = "prefix"
short = "^q で入力から抜けて Sessions に戻る"
detail = "入力中はキーがすべてエージェントに届き、抜けるのは ^q だけ。入力していないときは ^q h / ^q l で左右のパネルへ移る。prefix は config.toml の [keys] prefix で変えられる。"
keys = ["^q", "^q h", "^q l", "[keys]"]
docs = ["docs/tui.md", "docs/config.md"]

[[tip]]
id = "dev-server"
short = "d でそのセッションのポートに dev server を立てる"
detail = "リポジトリの設定の [hooks] dev を、セッションごとのポートで起動・停止する。b でそのポートを Chrome で開き、v を押していくと dev 窓でログが見られる。CLI は pekoe dev <slug>。"
keys = ["d", "b", "pekoe dev <slug>"]
docs = ["docs/config.md"]

[[tip]]
id = "end-and-resume"
short = "x でセッションを終えても worktree は残る"
detail = "x はエージェントを止めるだけで、worktree と変更は残る。R で Claude Code の同じ会話を resume して起動し直せる。worktree ごと消すのは D(確認あり。pekoe が作った worktree のとき)。"
keys = ["x", "R", "D"]
docs = ["docs/tui.md"]

[[tip]]
id = "mcp"
short = "pekoe mcp でエージェントが nvim にファイルを開ける"
detail = "claude mcp add pekoe -- pekoe mcp で登録すると、エージェントが open_in_editor でファイルの行を nvim に開いてメモを添えられる。session_list でセッションの一覧も読める。"
keys = ["pekoe mcp"]
docs = ["README.ja.md#mcp"]

[[tip]]
id = "skills"
short = "pekoe skills install でスキルを Claude Code に入れる"
detail = "pekoe・pekoe-orchestrate・pekoe-work・pekoe-review の 4 つを ~/.claude/skills にリンクする。統括役の回し方・作業の進め方・独立レビューの手順。中身はバイナリに同梱で、pekoe update の後も新しくなる。"
keys = ["pekoe skills"]
docs = ["docs/install.md#claude-code-スキルのインストール", "docs/orchestration.md"]

[[tip]]
id = "init"
short = "pekoe init でリポジトリの設定を下書きする"
detail = "lockfile・.envrc・無視ファイルから setup や copy を推測して書き、本体で main セッションを起動する(既にあれば何もしない)。--print は出すだけ、--no-open は起動しない。"
keys = ["pekoe init", "--print", "--no-open"]
docs = ["docs/commands.md#pekoe-init-が下書きするもの"]

[[tip]]
id = "update"
short = "pekoe update で最新のリリースに入れ替える"
detail = "GitHub の最新リリースを取って checksums.txt と照らし、pekoe と nvim・Chrome 拡張を入れ替える。Web UI 入りなら _web の版を取る。--check は新しい版があるか見るだけ。"
keys = ["pekoe update", "--check"]
docs = ["docs/install.md#更新"]

[[tip]]
id = "update-provenance"
short = "pekoe update は v0.4.0 以降の来歴(attestation)を確かめる"
detail = "v0.4.0 以降は、来歴が無い・gh attestation verify が通らないと何も入れ替えずに止まる(gh が無い・未ログインなら警告だけ)。リリースを自分で確かめて続けるなら --allow-unverified。"
keys = ["pekoe update", "--allow-unverified"]
docs = ["docs/install.md#更新"]

[[tip]]
id = "hook-sandbox"
short = "[hooks] の test・setup・dev と門番は sandbox の中で動く"
detail = "human-token を読めない sandbox で動かす(macOS は sandbox-exec、Linux は bwrap)。使えなければ hooks は動かさない。pekoed の git も sandbox で動く(無ければ素のまま)。[sandbox] enable = false で外せる。"
keys = ["[sandbox]"]
docs = ["docs/agent-permissions.md", "docs/api.md"]

[[tip]]
id = "agent-sandbox"
short = "Claude Code は pekoe が渡す sandbox の中で動く"
detail = "--settings で human-token などを読めなくする。キャッシュやドメインは ~/.claude/settings.json に allowWrite / allowedDomains だけ書いて足す。[agents.claude] sandbox = false で外せる。"
keys = ["[agents]"]
docs = ["docs/agent-permissions.md"]

[[tip]]
id = "agent-model"
short = "モデルは [agents.claude] model で固定する"
detail = "起動のたびに --model / --effort を渡す。無いと、どこかで /model を打つと後の全セッションが替わる。1 つだけなら pekoe new --model M --effort E。実際は --json ls の last_model。"
keys = ["[agents]", "pekoe new", "--model", "--effort"]
docs = ["docs/config.md"]

[[tip]]
id = "agent-dev"
short = "エージェントも pekoe dev で自分の dev server を立てる"
detail = "自分の sandbox ではポートを開けないエージェントが、UI を確かめるときに使う。効くのは呼び出し元のセッションの分だけで、ほかの slug は断られる。[hooks] dev は pekoe の sandbox で動く。"
keys = ["pekoe dev <slug>"]
docs = ["docs/api.md"]

[[tip]]
id = "dev-log"
short = "pekoe dev --log で dev server の出力と終わり方を読む"
detail = "[hooks] dev の出力は色を除いてファイルにも残る。pekoe dev --log [<slug>] で末尾と、動いているか・終了コード・終わった時刻を出す。エージェントは自分のセッションの分だけ読める。"
keys = ["pekoe dev --log", "--lines"]
docs = ["docs/config.md", "docs/api.md"]

[[tip]]
id = "dev-stop"
short = "[hooks] dev_stop で dev が立てたコンテナを片付ける"
detail = "dev を止めたとき・dev が自分で終わったときに dev と同じ sandbox で動く。成功しないまま rm したら rm で再実行し、それでも駄目ならそのポートを 7 日間使い回さない。"
keys = ["pekoe dev <slug>"]
docs = ["docs/config.md"]

[[tip]]
id = "cleanup"
short = "pekoe cleanup(TUI は :cleanup)で片付けの候補を消す"
detail = "landed・マージ済み・長く止まった([cleanup] stale_after、既定 72h)セッションを未コミット・未 push の数と出す。--rm <slug> か --rm --landed で消す(エージェントは landed だけ)。:cleanup は space と D。"
keys = ["pekoe cleanup", "--rm", "--landed", "--stale", "[cleanup]"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "leftover-procs"
short = "rm と land の片付けは窓が残したプロセスも止める"
detail = "窓を閉じた後、エージェントが & で放った busy loop やサーバーを環境変数($PEKOE_SESSION・$TMUX)で探して止め、数とコマンドを pekoed のログに残す。止めた・再起動したセッションのものは止めない。"
keys = ["pekoe rm <slug>"]
docs = ["docs/design.md", "docs/commands.md"]

[[tip]]
id = "repo-forget"
short = "pekoe repo forget で使わなくなったリポジトリを忘れさせる"
detail = "w のリポジトリ選びや tapi が知るリポジトリから外す。landed でないセッションがあれば断る(先に pekoe rm)。repos/<repo-id>.toml は --config のときだけ消す。リポジトリ・worktree・ブランチ・stats は残る。"
keys = ["pekoe repo", "--config"]
docs = ["docs/commands.md", "docs/api.md"]

[[tip]]
id = "stats"
short = "pekoe stats で日ごとのマージ数とトークンを見る"
detail = "pekoe が見届けたマージと、エージェント(サブエージェント・tapi も)が使ったトークンを日付・リポジトリごとに出す。rm した分も残り、動いている分はその時点まで。--days N(既定 7)、--repo R。"
keys = ["pekoe stats", "--days"]
docs = ["docs/orchestration.md", "docs/api.md"]

[[tip]]
id = "config-edit"
short = "^q , で config.toml をエディタで開く"
detail = "pekoe config edit と同じ($EDITOR、無ければ vi)。保存すると中身を確かめ、知らないキーや受け付けない値があれば開き直すか聞く。pekoe config show で既定値込みの今の設定、check で確かめるだけ。"
keys = ["^q ,", "pekoe config"]
docs = ["docs/config.md"]

[[tip]]
id = "voice"
short = "pekoe voice on で状態の変化を tapi が喋る"
detail = "macOS だけ。確認待ち・終わった・エラー・受信箱の質問を呼び名付きで短く言う。on / off は config.toml の [voice] enable を書き換える(既定はオフ)。pekoe voice test で試し、mute で黙らせ、log で見返す。"
keys = ["pekoe voice", "[voice]"]
docs = ["docs/voice.md", "docs/config.md"]

[[tip]]
id = "voice-mode"
short = "pekoe voice mode <slug> mute で 1 つだけ黙らせる"
detail = "既定はフォーカス中が read、ほかが narrate。read・narrate・mute を決めると、そのセッションはフォーカスに関係なくそれで喋る。auto で既定に戻す。全体の mute が勝ち、pekoe rm で消える。"
keys = ["pekoe voice"]
docs = ["docs/voice.md"]

[[tip]]
id = "voice-read"
short = "pekoe voice on なら見ているセッションの返事を読み上げる"
detail = "Claude Code の返事を、コード・表・URL を飛ばして 1 ターン 10 文まで読む([voice.read])。入力する・[4] で esc を押す・フォーカスを移すと止まる。"
keys = ["[voice]"]
docs = ["docs/voice.md"]

[[tip]]
id = "voice-mute"
short = "^q m で音声をすぐ止めてミュート"
detail = "入力中でも、どのパネルからでも効く。鳴っているものもキューも止まり、もう一度押すと戻る。ミュート中は最下行に muted ^q m と出る。:voice で喋ったことを新しい方から見返す。"
keys = ["^q m"]
docs = ["docs/voice.md", "docs/tui.md"]

[[tip]]
id = "notify-timing"
short = "待ちの知らせの間合いは [notify] で変えられる"
detail = "トーストの長さ toast_for(5s)、台詞の点滅 blink_after(30s)、OS 通知 os_after(2m)。[mascot] sleep_after(3m)で tapi が眠るまで、[pr] poll_every(1m、下限 30s)で PR を見る間隔。保存すれば再起動なしで効く。"
keys = ["[notify]", "[pr]"]
docs = ["docs/mascot.md", "docs/config.md"]

[[tip]]
id = "session-marks"
short = "Sessions の行の印で PR・エラー・テストが分かる"
detail = "ブランチの後ろに #42 と PR の状態のアイコン(CI の成否・changes・merged)、err は pekoed が拾ったエラー、• は見ていない出力か PR の動き(PR の分は p で消える)。右端は +追加 -削除 とテストの ✓ ✗。"
keys = ["p"]
docs = ["docs/ui-guidelines.md#状態の表現", "docs/tui.md"]

[[tip]]
id = "permission-modal"
short = "許可待ちのセッションを選ぶと、その場で答えられる"
detail = "Permission モーダルが出て、y 許可・n 拒否・A 常に許可・g そのセッションへ・esc 後で。触るファイルを、ほかのセッションも変えていれば also changed in と出る。CLI は pekoe answer。"
keys = ["pekoe answer"]
docs = ["docs/tui.md"]

[[tip]]
id = "review-ask"
short = "レビュー面の ? で hunk の意図をエージェントに聞く"
detail = "返事は次の Stop で切り出して出る。各 hunk には生まれたプロンプト(← prompt #3)が付く。S で送るとレビュー地点が残り、次のレビューはそこからの差分だけ(since …)。"
keys = ["?", "r"]
docs = ["docs/tui.md#レビュー"]

[[tip]]
id = "auto-test"
short = "ターンが終わるたびに [hooks] test が自動で走る"
detail = "結果は行の右端とレビュー面に ✓ / ✗。新しい Stop が来たら古いテストは止める。リポジトリの設定の [review] gatekeeper を書くと、門番が危ない箇所を Comments と nvim の :PekoeRisks に出す。"
keys = ["r", ":PekoeRisks"]
docs = ["docs/tui.md#レビュー", "nvim/README.md#コマンド"]

[[tip]]
id = "test-could-not-run"
short = "⚠ test could not run は test のコマンドが無い印"
detail = "[hooks] test のコマンドが見つからない(終了コード 127)ときは ✗ ではなくこれが出る。入れるか repos の toml の test を直す。test を消すと前の結果は次の Stop で消える。"
keys = ["pekoe init"]
docs = ["docs/tui.md#レビュー"]

[[tip]]
id = "sandbox-warnings"
short = "⚠ test not run や .git changed が出たら止まっている"
detail = "test not run: no sandbox は sandbox が無くて test と門番を動かさなかった印。.git changed: git stopped は worktree の .git が書き換えられ、pekoed がそこで git を止めた印で、戻すと消える。"
keys = ["[sandbox]"]
docs = ["docs/agent-permissions.md"]

[[tip]]
id = "click-links"
short = "エージェントの画面の URL はクリックで開ける"
detail = "pekoe がマウスを握るので ⌘ クリックは届かないが、OSC 8 のリンクや素の URL は左クリックで開く(http(s) だけ)。PR ビュー・Issues・ダッシュボードも同じ。左のパネルのクリックは ^q と同じく入力から抜ける。"
keys = ["^q"]
docs = ["docs/tui.md"]

[[tip]]
id = "wheel-enters-pane"
short = "4 はホイールかクリックでそのまま入力に入る"
detail = "エージェントの画面の上のホイールと左クリックは、↵ で入ったのと同じく 4 を打ち込み中にする。ホイールは最初の 1 回からスクロールが届き、入るためのクリックはエージェントに送らない。抜けるのは ^q。"
keys = ["^q"]
docs = ["docs/design.md"]

[[tip]]
id = "tapi-pr-react"
short = "tapi は PR のマージや CI の失敗にトーストで反応する"
detail = "マージ・CI の失敗・changes requested・新しいコメント・承認などに 1 回だけ。マージは紙吹雪。開いた PR の CI が赤のまま idle だと目が曇る。animate = false で紙吹雪と動きを止める。"
keys = ["[animate]"]
docs = ["docs/mascot.md#pr-と-ci-への反応"]

[[tip]]
id = "mascot-glyphs"
short = "tapi を ASCII だけで描くなら [mascot] glyphs = \"ascii\""
detail = "既定の auto は、どのフォントでも 1 セルに収まる字で描き、[theme] ambiguous が wide のときは ASCII。以前の narrow はもう要らない(pekoe config check が消してよいと教える)。"
keys = ["[mascot]"]
docs = ["docs/mascot.md#実装仕様", "docs/config.md"]

[[tip]]
id = "theme-ambiguous"
short = "枠や記号がずれたら [theme] ambiguous = \"wide\""
detail = "端末が ● ─ などの曖昧幅を 2 セルで数える設定(iTerm2 など)向け。既定の auto は TUI を開くときに測る。wide では枠線を + - |、記号を ... -> にし、アイコンと tapi は ascii。開き直すと効く。"
keys = ["[theme]"]
docs = ["docs/ambiguous-width.md", "docs/config.md"]

[[tip]]
id = "nvim-diagnostics"
short = "nvim の :PekoeFixDiagnostics で LSP の診断を送る"
detail = "バッファの診断を path:line: severity: message の一覧にしてエージェントに送る。! を付けるとワークスペース全体。送り先は :PekoeSessions で選べる。"
keys = [":PekoeFixDiagnostics"]
docs = ["nvim/README.md#コマンド"]

[[tip]]
id = "web-ipad"
short = "iPad の横向きでは Web UI が 2 画面になる"
detail = "幅が 700px 以上だと、左端のレール(Now / Sessions)と、Now の 3 列のダッシュボード、Sessions の一覧の横の tapi chat に並び替わる。同じ URL のまま、縦にすれば iPhone の配置に戻る。"
keys = ["pekoe web"]
docs = ["docs/web.md"]

[[tip]]
id = "web-now-flow"
short = "Web UI の Now で依頼の止まった工程が分かる"
detail = "上端の数の帯(waiting・inbox・running・to review)は押すとその一覧へ。依頼の 5 工程は点と線で、人の番は warn の ◉。pekoed のマージのカードと Inbox では、マージの 6 条件と CI のチェックを棒で出す。"
keys = ["pekoe web"]
docs = ["docs/web.md"]

[[tip]]
id = "issue-watch"
short = "ラベル付きの issue から自動でセッション(issue 監視)"
detail = "repos/<repo-id>.toml の [watch] enable = true で、pekoed が数分ごとに open issue を見て、書き込み権限のある人が labels(既定 agent-ready)を付けた issue から --from gh#N と同じセッションを作る。"
keys = ["pekoe config check"]
docs = ["docs/config.md#issue-監視モード", "docs/orchestration.md#issue-監視モード"]
