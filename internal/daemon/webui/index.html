<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#151421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="boba">
<meta name="referrer" content="no-referrer">
<title>boba</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button class="back" id="back" hidden aria-label="back">‹ sessions</button>
  <h1 id="title">boba</h1>
  <span class="sum" id="sum"></span>
</header>

<main id="list" aria-live="polite"></main>

<main id="detail" hidden>
  <section class="head" id="d-head"></section>
  <section class="ask" id="d-ask" hidden></section>
  <section class="screen">
    <div class="cap">screen <span class="dim" id="d-at"></span></div>
    <pre id="d-screen" tabindex="0"></pre>
  </section>
  <form class="send" id="d-send" autocomplete="off">
    <textarea id="d-text" rows="2" maxlength="4000" placeholder="一言の指示を送る" enterkeyhint="send"></textarea>
    <button type="submit" class="btn key" id="d-send-btn">send</button>
  </form>
</main>

<footer class="who" id="who"></footer>

<div class="sheet-back" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div class="target" id="sheet-tool"></div>
    <pre class="input" id="sheet-input"></pre>
    <div class="row">
      <button class="btn" id="sheet-cancel">cancel</button>
      <button class="btn" id="sheet-ok"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
