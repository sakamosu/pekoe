<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>boba 設定</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 420px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; font-family: ui-monospace, monospace; }
    .row { margin-top: 16px; display: flex; gap: 8px; }
    #status { margin-top: 12px; min-height: 1.5em; }
    .ok { color: #2e7d32; } .ng { color: #c62828; }
    p { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h2>boba</h2>
  <p>port と token は <code>boba ext</code> で表示できます。</p>
  <label for="port">Port</label>
  <input id="port" type="number" min="1" max="65535" placeholder="47777">
  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off">
  <div class="row">
    <button id="save">保存</button>
    <button id="test">接続テスト</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
