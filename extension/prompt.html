<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  * { box-sizing: border-box; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
  .box { padding: 6px; background: #1e1e2e; border: 1px solid #6366f1; border-radius: 6px; height: 100vh; }
  input { width: 100%; padding: 6px 8px; border: 0; border-radius: 4px; outline: none;
          background: #313244; color: #cdd6f4; font-size: 13px; }
  .hint { margin-top: 4px; color: #a6adc8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body><div class="box"><input id="in" placeholder="指示 (空で要素情報のみ)" autocomplete="off"><div class="hint" id="hint"></div></div>
<script src="prompt.js"></script></body></html>
