# pekoe のリリースビルド。v* タグの push で .github/workflows/release.yml が回す。
# Release は下書きで作る(下の release:)。来歴を付けて公開するのは release.yml。
# 手元で試すには: goreleaser release --snapshot --clean(dist/ にアーカイブができる)
#
# 配るのは 2 種類: 既定ビルド(Tailscale のコードなし)の pekoe_<ver>_<os>_<arch>.tar.gz と、
# -tags web(Web UI 入り。tsnet をリンクする)の pekoe_<ver>_<os>_<arch>_web.tar.gz。
# どちらも展開すると
#   README.md, LICENSE, THIRD_PARTY_LICENSES,
#   bin/pekoe, bin/pekoed(→ pekoe), share/pekoe/nvim/, share/pekoe/extension/, contrib/launchd/
# の配置になり、bin/pekoe が ../share/pekoe/nvim を見つける(internal/tui/review.go の NvimPluginDir)。
# pekoe update(internal/selfupdate)はこの名前と配置を前提に、今の pekoe が web 入りなら _web の方を取る。
# THIRD_PARTY_LICENSES はバイナリが静的リンクする依存(と Go)の著作権表示とライセンス文。
# 既定と web で依存が違うので、before.hooks で build/third-party/{default,web}/ にビルドごとに作り、
# 同じ名前でそれぞれのアーカイブに入れる(scripts/third-party-licenses.sh。build/ はコミットしない)。
version: 2

project_name: pekoe

before:
  hooks:
    - scripts/third-party-licenses.sh "" build/third-party/default/THIRD_PARTY_LICENSES
    - scripts/third-party-licenses.sh web build/third-party/web/THIRD_PARTY_LICENSES

builds:
  - id: pekoe
    main: ./cmd/pekoe
    binary: bin/pekoe
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X pekoe/internal/daemon.Version={{.Version}}
  - id: pekoe-web
    main: ./cmd/pekoe
    binary: bin/pekoe
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    tags: [web]
    ldflags:
      - -s -w -X pekoe/internal/daemon.Version={{.Version}}

# darwin のバイナリ(両 build の arm64・amd64)に Developer ID Application 証明書で署名し、Apple の公証に出す。
# quill を使うので ubuntu のランナーでできる。ビルドの直後・アーカイブの前に走るので、
# アーカイブの中身・checksums.txt・来歴(attestation)はどれも署名済みのバイナリに対するものになる。
# MACOS_SIGN_P12 が無い(fork やローカルの --snapshot)ときは丸ごととばし、Go リンカのアドホック署名のまま。
# 証明書と API キーは base64 にした中身を環境変数で渡す(作り方は CONTRIBUTING.md の「Cutting a release」)。
# 単体のバイナリには公証のチケットを留め付け(staple)できないので、Gatekeeper は初回にオンラインで確かめる。
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [pekoe, pekoe-web]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        # 結果が出るまで待ち、却下されたらリリースを止める。20m が上限(API のトークンの寿命)
        wait: true
        timeout: 20m

archives:
  - id: pekoe
    ids: [pekoe]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    # 2 つのアーカイブで THIRD_PARTY_LICENSES 以外は同じ。足すときは両方に
    files:
      - src: build/third-party/default/THIRD_PARTY_LICENSES
        strip_parent: true
      - README.md
      - README.ja.md
      - LICENSE
      - src: contrib/release/pekoed
        dst: bin
      - src: nvim/lua/pekoe/*
        dst: share/pekoe/nvim/lua/pekoe
      - src: nvim/plugin/*
        dst: share/pekoe/nvim/plugin
      - src: nvim/README.md
        dst: share/pekoe/nvim/README.md
      - src: extension/*
        dst: share/pekoe/extension
      - src: contrib/launchd/*
        dst: contrib/launchd
  - id: pekoe-web
    ids: [pekoe-web]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_web"
    wrap_in_directory: true
    # 2 つのアーカイブで THIRD_PARTY_LICENSES 以外は同じ。足すときは両方に
    files:
      - src: build/third-party/web/THIRD_PARTY_LICENSES
        strip_parent: true
      - README.md
      - README.ja.md
      - LICENSE
      - src: contrib/release/pekoed
        dst: bin
      - src: nvim/lua/pekoe/*
        dst: share/pekoe/nvim/lua/pekoe
      - src: nvim/plugin/*
        dst: share/pekoe/nvim/plugin
      - src: nvim/README.md
        dst: share/pekoe/nvim/README.md
      - src: extension/*
        dst: share/pekoe/extension
      - src: contrib/launchd/*
        dst: contrib/launchd

# Homebrew の tap(sakamosu/homebrew-tap。brew install sakamosu/tap/pekoe)に置く cask。
# GoReleaser v2 では brews(formula)は非推奨で homebrew_casks が後継なので cask にする。
# ここでは dist/homebrew/Casks/pekoe.rb を作るだけ(skip_upload: true)。tap に書くのは release.yml で、
# 下書きを公開した後(scripts/homebrew-tap.sh)。goreleaser が書くと、下書きの間に(attest が落ちて
# 公開されなくても)tap が落とせない URL を指してしまうのと、HOMEBREW_TAP_TOKEN や tap が無いときに
# リリースごと落ちないようにするため。配るのは既定のビルドだけ(_web は入れない)。
#
# 配置: cask はアーカイブを Caskroom/pekoe/<ver>/ に展開する。GoReleaser はラッパーのディレクトリ
# (pekoe_<ver>_<os>_<arch>/)から binaries だけを rename で外に出すので、そのままだと bin/pekoe と
# share/pekoe が別々の場所になり、bin/pekoe が ../share/pekoe/nvim を見つけられない。
# そこで custom_block(cask の先頭に出る = GoReleaser の rename より先に走る)で bin・share・contrib を
# まとめて外に出す(GoReleaser の rename は元が無ければ何もしない)。
# 結果は Caskroom/pekoe/<ver>/{bin/pekoe,bin/pekoed,share/pekoe,contrib/launchd} で、
# $(brew --prefix)/bin/pekoe → Caskroom/…/bin/pekoe の symlink を pekoe が辿って ../share/pekoe を見つける。
#
# quarantine: brew は cask で落としたものに com.apple.quarantine を付ける。未署名(ad-hoc 署名)の
# バイナリだと Gatekeeper に止められるので、postflight で外す。署名・公証済みでも外して害はない
# (公証のチケットを留め付けられない単体バイナリが初回にオンラインで確かめられるのを省くだけ)。
homebrew_casks:
  - name: pekoe
    ids: [pekoe]
    repository:
      owner: sakamosu
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/sakamosu/pekoe
    description: Run coding agents in parallel, one per git worktree, from a terminal UI
    binaries:
      - bin/pekoe
      - bin/pekoed
    dependencies:
      - formula: tmux
      - formula: git
    custom_block: |
      rename "pekoe_*/bin", "bin"
      rename "pekoe_*/share", "share"
      rename "pekoe_*/contrib", "contrib"
    hooks:
      post:
        # Homebrew の install steps DSL(任意の Ruby ではない)。{{ .StagedPath }} は GoReleaser が
        # Homebrew のトークン {{staged_path}} に置き換える。外せなくてもインストールは止めない
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"], must_succeed: false
          end
    caveats: |
      pekoe hooks install    # add pekoe's hooks to ~/.claude/settings.json
      To start pekoed at login with launchd:
        sed -e "s|PEKOE_BIN|#{HOMEBREW_PREFIX}/bin/pekoe|" -e "s|HOME|$HOME|g" #{staged_path}/contrib/launchd/dev.pekoe.pekoed.plist > ~/Library/LaunchAgents/dev.pekoe.pekoed.plist
        launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/dev.pekoe.pekoed.plist
      After brew upgrade, run `pekoe daemon restart` to switch pekoed to the new binary.

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

# 下書き(draft)で作ってアーカイブと checksums.txt を全部上げるところまでが goreleaser。
# release.yml が来歴(attestation)を付けてから公開する(gh release edit --draft=false)。
# immutable releases を有効にしたリポジトリでは、公開した後のリリースにアセットを足せず、
# 書き換えもできない。下書きの間は足せるので、全部そろえてから公開する。
# attest が落ちたら下書きのまま残る(公開されない)。やり直すときは workflow を再実行すれば、
# replace_existing_draft で同じ名前の下書きを消して作り直す。
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
